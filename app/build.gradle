plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.dadidi'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.dadidi'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 游戏为纯 HTML/JS，直接由系统 WebView 加载，无需第三方依赖
}
